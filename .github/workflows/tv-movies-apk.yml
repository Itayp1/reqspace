name: TV Movies APK

on:
  push:
    paths:
      - 'tv-movies/android/**'
      - '.github/workflows/tv-movies-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tv-movies/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: tv-movies-apk
          path: tv-movies/android/app/build/outputs/apk/release/app-release.apk
