name: Test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        db: [sqlite, postgres, mysql]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: ''
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: reqspace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: reqspace_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install & build server
        run: |
          npm ci --prefix server
          npm run build --prefix server

      - name: Install & build client
        run: |
          npm ci --prefix client
          npm run build --prefix client

      - name: Start server (${{ matrix.db }} backend)
        run: |
          DB_TYPE=${{ matrix.db }} DB_STORAGE_PATH=/tmp/ci.sqlite NODE_ENV=development PORT=3005 \
            DB_HOST=127.0.0.1 DB_USER=root DB_PASSWORD="" DB_NAME=reqspace_test \
            CERT_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef \
            node server/dist/index.js > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3005/api/health >/dev/null; then echo "server up"; break; fi
            sleep 1
          done
          curl -sf http://localhost:3005/api/health || (echo "server failed to start"; cat /tmp/server.log; exit 1)

      - name: Server tests (jest — unit + ssrf + live auth e2e)
        run: npm test --prefix server
        env:
          DB_TYPE: ${{ matrix.db }}
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: ""
          DB_NAME: reqspace_test

      - name: Core smoke (crosses the auth boundary, ${{ matrix.db }})
        run: bash scripts/smoke-core.sh http://localhost:3005

      - name: Install Playwright & dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: |
          npx playwright test --project=${{ matrix.db }}
          if [ "${{ matrix.db }}" = "sqlite" ]; then npx playwright test --project=extension; fi
        env:
          DB_TYPE: ${{ matrix.db }}
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: ""
          DB_NAME: reqspace_test

      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/server.pid)" 2>/dev/null || true
