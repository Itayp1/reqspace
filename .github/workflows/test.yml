name: Test

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install & build server
        run: |
          npm ci --prefix server
          npm run build --prefix server

      - name: Install & build client
        run: |
          npm ci --prefix client
          npm run build --prefix client

      - name: Start server (sqlite backend)
        run: |
          DB_TYPE=sqlite DB_STORAGE_PATH=/tmp/ci.sqlite NODE_ENV=development PORT=3005 \
            node server/dist/index.js > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3005/api/health >/dev/null; then echo "server up"; break; fi
            sleep 1
          done
          curl -sf http://localhost:3005/api/health || (echo "server failed to start"; cat /tmp/server.log; exit 1)

      - name: Server tests (jest — unit + ssrf + live auth e2e)
        run: npm test --prefix server

      - name: Core smoke (crosses the auth boundary, sqlite)
        run: bash scripts/smoke-core.sh http://localhost:3005

      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/server.pid)" 2>/dev/null || true

  db-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: postgres
            env: DB_TYPE=postgres DB_HOST=127.0.0.1 DB_PORT=5432 DB_NAME=reqspace DB_USER=postgres DB_PASSWORD=reqspace PORT=3012
          - name: mysql
            env: DB_TYPE=mysql DB_HOST=127.0.0.1 DB_PORT=3306 DB_NAME=reqspace DB_USER=root DB_PASSWORD=reqspace PORT=3013
          - name: mongodb
            env: DB_TYPE=mongodb MONGODB_URI=mongodb://127.0.0.1:27017/reqspace PORT=3014
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: reqspace
          POSTGRES_DB: reqspace
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: reqspace
          MYSQL_DATABASE: reqspace
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -preqspace"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and build server
        run: |
          npm ci --prefix server
          npm run build --prefix server
      - name: Smoke ${{ matrix.name }}
        env:
          MATRIX_ENV: ${{ matrix.env }}
        run: |
          set -a
          eval "$MATRIX_ENV"
          set +a
          node server/dist/index.js > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid
          for i in $(seq 1 40); do
            if curl -sf "http://127.0.0.1:${PORT}/api/health" >/dev/null; then echo "server up"; break; fi
            sleep 2
          done
          curl -sf "http://127.0.0.1:${PORT}/api/health" || (cat /tmp/server.log; exit 1)
          bash scripts/smoke-core.sh "http://127.0.0.1:${PORT}"
      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/server.pid)" 2>/dev/null || true
