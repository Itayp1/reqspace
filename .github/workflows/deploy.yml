name: Build and Deploy

on:
  push:
    branches: [master]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Needed to cross-build the arm64 variant (Oracle/Coolify host is Ampere)
      # on the amd64 GitHub runner.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/itayp1/reqspace:latest
            ghcr.io/itayp1/reqspace:${{ github.sha }}

      # Coolify's API is only reachable over Tailscale, so join the tailnet
      # as tag:ci (needs TS_OAUTH_CLIENT_ID / TS_OAUTH_CLIENT_SECRET).
      - uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      # Needs secrets COOLIFY_API_TOKEN (scope: deploy) and
      # COOLIFY_REQSPACE_UUID (the Coolify app's uuid). Coolify v4.4.2
      # requires POST on this endpoint.
      - name: Trigger Coolify deploy (reqspace on Oracle)
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_REQSPACE_UUID: ${{ secrets.COOLIFY_REQSPACE_UUID }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            "http://100.119.14.58:8000/api/v1/deploy?uuid=$COOLIFY_REQSPACE_UUID&force=false"
