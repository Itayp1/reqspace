apiVersion: apps/v1
kind: Deployment
metadata:
  name: reqspace-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: reqspace-web
  template:
    metadata:
      labels:
        app: reqspace-web
    spec:
      containers:
      - name: reqspace-web
        image: reqspace-web:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: reqspace-web-config
        - secretRef:
            name: reqspace-web-secret
