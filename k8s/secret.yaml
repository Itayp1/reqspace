apiVersion: v1
kind: Secret
metadata:
  name: reqspace-web-secret
type: Opaque
# JWT_SECRET is intentionally NOT committed. A previous version of this file
# shipped the base64 of "change_me_in_production" here — a signing key
# published in a public repository, letting anyone forge a session for any
# user, superadmin included. server/src/utils/jwtSecret.ts now refuses to
# boot with that value (or any other known placeholder), so a cluster
# applying this manifest without supplying a real secret fails to start
# instead of silently running with a public key.
#
# Supply the real value from a SealedSecret or an external secrets manager,
# e.g.:
#   kubectl create secret generic reqspace-web-secret \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)"
#
# If this manifest was ever applied with the placeholder value, rotate the
# secret and treat every existing session as compromised — they were signed
# with a key anyone could read.
