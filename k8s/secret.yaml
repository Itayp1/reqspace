apiVersion: v1
kind: Secret
metadata:
  name: reqspace-web-secret
type: Opaque
# JWT_SECRET is intentionally NOT committed. The value that used to live here
# (base64 of "change_me_in_production") is public in this repository's history,
# so it is permanently burned and is now rejected at startup by
# server/src/utils/jwtSecret.ts.
#
# Supply it from a SealedSecret or an external secrets manager:
#   kubectl create secret generic reqspace-web-secret \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)"
#
# deployment.yaml consumes this via `envFrom: secretRef`, so the Secret object
# must exist but may be empty. With no JWT_SECRET present the pod refuses to
# start in production — that is deliberate, not a misconfiguration.
