<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reqspace Transport</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 300px;
      min-height: 200px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      padding: 0;
    }

    /* ── Header ─────────────────────────────────── */
    .header {
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #2d2b55;
    }

    .header img {
      width: 36px;
      height: 36px;
      border-radius: 8px;
    }

    .header-text h1 {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.01em;
    }

    .header-text p {
      font-size: 11px;
      color: #a5b4fc;
      margin-top: 1px;
    }

    /* ── Status ──────────────────────────────────── */
    .status-card {
      margin: 14px 14px 0;
      background: #1a1f2e;
      border: 1px solid #2d3348;
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .status-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .status-dot.active {
      background: #22c55e;
      box-shadow: 0 0 6px #22c55e88;
    }

    .status-dot.inactive {
      background: #6b7280;
    }

    .status-label {
      font-size: 13px;
      font-weight: 600;
    }

    .status-label.active { color: #22c55e; }
    .status-label.inactive { color: #9ca3af; }

    .status-sub {
      font-size: 11px;
      color: #64748b;
      margin-top: 2px;
    }

    /* ── Stats ───────────────────────────────────── */
    .stats-row {
      display: flex;
      gap: 10px;
      margin: 10px 14px 0;
    }

    .stat-card {
      flex: 1;
      background: #1a1f2e;
      border: 1px solid #2d3348;
      border-radius: 8px;
      padding: 10px 12px;
      text-align: center;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 700;
      color: #a5b4fc;
      line-height: 1;
    }

    .stat-label {
      font-size: 10px;
      color: #64748b;
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* ── Allowed origin strip ────────────────────── */
    .origin-strip {
      margin: 10px 14px 0;
      background: #1a1f2e;
      border: 1px solid #2d3348;
      border-radius: 8px;
      padding: 10px 12px;
    }

    .origin-strip-title {
      font-size: 10px;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }

    #allowedOrigins {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 60px;
      overflow-y: auto;
    }

    .origin-pill {
      font-size: 11px;
      color: #94a3b8;
      background: #0f1117;
      border: 1px solid #2d3348;
      border-radius: 4px;
      padding: 3px 7px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Footer actions ──────────────────────────── */
    .actions {
      display: flex;
      gap: 8px;
      margin: 12px 14px 14px;
    }

    .btn {
      flex: 1;
      padding: 8px 10px;
      border: none;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: filter 0.15s;
      text-align: center;
    }

    .btn:hover { filter: brightness(1.15); }

    .btn-primary {
      background: #4f46e5;
      color: #fff;
    }

    .btn-secondary {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #2d3348;
    }

    /* ── Test result flash ───────────────────────── */
    #testResult {
      font-size: 11px;
      text-align: center;
      min-height: 16px;
      color: #64748b;
      margin: 0 14px 2px;
      transition: color 0.3s;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="Reqspace icon" />
    <div class="header-text">
      <h1>Reqspace Transport</h1>
      <p>CORS bypass for Reqspace</p>
    </div>
  </div>

  <div class="status-card">
    <div class="status-left">
      <div class="status-dot active" id="statusDot"></div>
      <div>
        <div class="status-label active" id="statusLabel">Active</div>
        <div class="status-sub" id="statusSub">Extension running</div>
      </div>
    </div>
  </div>

  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-value" id="reqCount">0</div>
      <div class="stat-label">Requests sent</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="originCount">0</div>
      <div class="stat-label">Allowed origins</div>
    </div>
  </div>

  <div class="origin-strip">
    <div class="origin-strip-title">Allowed Origins</div>
    <div id="allowedOrigins"></div>
  </div>

  <div id="testResult"></div>

  <div class="actions">
    <button class="btn btn-primary" id="testBtn">⚡ Test</button>
    <button class="btn btn-secondary" id="optionsBtn">⚙ Options</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
